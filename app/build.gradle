plugins { id 'com.android.application' }

// Real main-app updates must use ONE stable signing identity.
// The signing archive is encrypted in git and unlocked only by a private Actions secret.
// Never commit release passwords or unencrypted keystores.
def releasePassword = System.getenv('RINGADING_RELEASE_PASSWORD')
def releaseKeystore = System.getenv('RINGADING_KEYSTORE_PATH')

android {
    namespace 'uk.co.pix91.ringading'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.pix91.ringading'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '0.4.2'
        manifestPlaceholders = [appLabel: 'Ringading']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        persistentRelease {
            if (releasePassword && releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias 'ringading'
                keyPassword releasePassword
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            // Preview never replaces the currently installed and working v0.1 app.
            applicationIdSuffix '.pixpreview'
            manifestPlaceholders = [appLabel: 'Ringading Pix91 Preview']
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.persistentRelease
            manifestPlaceholders = [appLabel: 'Ringading']
        }
    }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}
dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}
