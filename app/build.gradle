plugins { id 'com.android.application' }

android {
    namespace 'uk.co.lumsdon.ringading'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.lumsdon.ringading'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.2.0-beta'
        manifestPlaceholders = [appLabel: 'Ringading']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            // Side-by-side beta to preserve the previously working v0.1 APK.
            // Ephemeral GitHub debug signatures cannot update that install in place.
            applicationIdSuffix '.beta'
            manifestPlaceholders = [appLabel: 'Ringading Beta']
        }
        release { minifyEnabled false }
    }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    testImplementation 'junit:junit:4.13.2'
}
