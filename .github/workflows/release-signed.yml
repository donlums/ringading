name: Ringading signed main app (permanent update key)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RINGADING_RELEASE_PASSWORD: ${{ secrets.RINGADING_RELEASE_PASSWORD }}
      RINGADING_KEYSTORE_PATH: ${{ github.workspace }}/ringading-release.p12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Unlock permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RINGADING_RELEASE_PASSWORD:-}" ]; then
            echo "::error::Repository secret RINGADING_RELEASE_PASSWORD is missing. Do not publish unsigned main-app builds."
            exit 1
          fi
          umask 077
          base64 -d signing/ringading-release.p12.gpg.b64 > "${RUNNER_TEMP}/ringading-release.p12.gpg"
          gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-fd 3 \
            --output "${RINGADING_KEYSTORE_PATH}" --decrypt "${RUNNER_TEMP}/ringading-release.p12.gpg" \
            3<<<"${RINGADING_RELEASE_PASSWORD}"
          test -s "${RINGADING_KEYSTORE_PATH}"
          keytool -list -keystore "${RINGADING_KEYSTORE_PATH}" -storepass:env RINGADING_RELEASE_PASSWORD >/dev/null
      - name: Test and build signed main Ringading
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify APK signed with permanent certificate
        shell: bash
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk
      - name: Upload signed Ringading update APK
        uses: actions/upload-artifact@v4
        with:
          name: Ringading-v0.4.3-main-Pix91-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Destroy temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "${RINGADING_KEYSTORE_PATH}" "${RUNNER_TEMP}/ringading-release.p12.gpg"
